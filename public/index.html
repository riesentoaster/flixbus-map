<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlixBus route map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>html, body, #map { height: 100%; margin: 0; }</style>
</head>
<body>
<div id="map"></div>
<script>
const map = L.map("map", { preferCanvas: true }).setView([50, 10], 5);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
}).addTo(map);

fetch("data.json").then(r => r.json()).then(({ stops, routes }) => {
  const latlngs = stops.map(([lon, lat]) => [lat, lon]);
  const lines = routes.map(edges => L.polyline(edges.map(([a, b]) => [latlngs[a], latlngs[b]]), { weight: 1.5 }).addTo(map));

  // Highlight routes through `stop`; null highlights all.
  function focus(stop) {
    routes.forEach((edges, i) => {
      const hit = stop === null || edges.some(e => e.includes(stop));
      lines[i].setStyle({ color: hit ? "#73d700" : "#bbb" });
      if (hit) lines[i].bringToFront();
    });
  }
  focus(null);
  map.on("click", () => focus(null));
  latlngs.forEach((p, i) =>
    L.circleMarker(p, { radius: 2, color: "#333", weight: 1, fillOpacity: 1, bubblingMouseEvents: false })
      .on("click", () => focus(i)).addTo(map));
});
</script>
</body>
</html>
