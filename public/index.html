<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlixBus route map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  html, body, #map { height: 100%; margin: 0; }
  #info { position: absolute; top: 10px; right: 10px; z-index: 1000; background: #fff; padding: 6px 10px; border-radius: 4px; font: 13px sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  #info button { margin-left: 6px; padding: 3px 9px; border: 0; border-radius: 4px; background: #6a1b9a; color: #fff; font: inherit; cursor: pointer; }
  #info button:hover { background: #4a148c; }
  #info button:disabled { background: #999; }
</style>
</head>
<body>
<div id="map"></div>
<div id="info">Loading… <button id="update">Update</button></div>
<script>
const map = L.map("map", { preferCanvas: true }).setView([50, 10], 5);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
}).addTo(map);

const params = new URLSearchParams(location.search);

fetch("data.json?v=" + (params.get("v") || "")).then(r => r.json()).then(({ updated, stops, routes }) => {
  info.firstChild.textContent = `Data from ${new Date(updated).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })}`;
  const latlngs = stops.map(([lon, lat]) => [lat, lon]);
  const lines = routes.map(edges => L.polyline(edges.map(([a, b]) => [latlngs[a], latlngs[b]]), { weight: 1.5 }).addTo(map));
  // Stops live on their own canvas above the routes, so a click always hits the stop, not a line under it.
  map.createPane("stops").style.zIndex = 450;
  const stopsRenderer = L.canvas({ pane: "stops", tolerance: 6 }); // 6 px of extra click area around each dot

  // Highlight routes through `stop`; null highlights all. The selection is kept in the URL as ?stop=<code>.
  function focus(stop) {
    routes.forEach((edges, i) => {
      const hit = stop === null || edges.some(e => e.includes(stop));
      lines[i].setStyle({ color: hit ? "#6a1b9a" : "#999", opacity: hit ? 1 : 0.25, weight: hit && stop !== null ? 3 : 1.5 });
      if (hit) lines[i].bringToFront();
    });
    if (stop === null) params.delete("stop"); else params.set("stop", stops[stop][2]);
    params.delete("v");
    history.replaceState(null, "", location.pathname + (params.size ? "?" + params : ""));
  }
  const initial = stops.findIndex(s => s[2] === params.get("stop"));
  focus(initial < 0 ? null : initial);
  map.on("click", () => focus(null));
  latlngs.forEach((p, i) =>
    L.circleMarker(p, { renderer: stopsRenderer, radius: 2, color: "#333", weight: 1, fillOpacity: 1, bubblingMouseEvents: false })
      .on("click", () => focus(i)).addTo(map));
}).catch(() => info.firstChild.textContent = "No data yet ");

// Rebuilds the data on the server, then reloads with a cache-buster so the new file is fetched.
update.onclick = () => {
  update.disabled = true;
  update.textContent = "Updating…";
  fetch("/api/update", { method: "POST" }).then(r => r.json()).then(({ updated }) => {
    params.set("v", updated);
    location.search = params;
  }).catch(() => update.textContent = "Update failed");
};
</script>
<style>
  html, body, #map { height: 100%; margin: 0; }
  #info { position: absolute; top: 10px; right: 10px; z-index: 1000; background: #fff; padding: 6px 10px; border-radius: 4px; font: 13px sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  #info button { margin-left: 6px; padding: 3px 9px; border: 0; border-radius: 4px; background: #6a1b9a; color: #fff; font: inherit; cursor: pointer; }
  #info button:hover { background: #4a148c; }
  #info button:disabled { background: #999; }
</style>
</head>
<body>
<div id="map"></div>
<div id="info">Loading… <button id="update">Update</button></div>
<script>
const map = L.map("map", { preferCanvas: true }).setView([50, 10], 5);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {

fetch("data.json").then(r => r.json()).then(({ updated, stops, routes }) => {

  const latlngs = stops.map(([lon, lat]) => [lat, lon]);
  const lines = routes.map(edges => L.polyline(edges.map(([a, b]) => [latlngs[a], latlngs[b]]), { weight: 1.5 }).addTo(map));

  map.createPane("stops").style.zIndex = 450;
  const stopsRenderer = L.canvas({ pane: "stops", tolerance: 6 }); // 6 px of extra click area around each dot

  // Highlight routes through `stop`; null highlights all.

    routes.forEach((edges, i) => {
      const hit = stop === null || edges.some(e => e.includes(stop));
      lines[i].setStyle({ color: hit ? "#6a1b9a" : "#999", opacity: hit ? 1 : 0.25, weight: hit && stop !== null ? 3 : 1.5 });
      if (hit) lines[i].bringToFront();
    });
  }

  map.on("click", () => focus(null));
  latlngs.forEach((p, i) =>

      .on("click", () => focus(i)).addTo(map));

// Triggers a redeploy, which downloads a fresh feed. Takes about a minute.
update.onclick = () => {
  update.disabled = true;
  fetch("/api/update", { method: "POST" }).then(r => {
    update.replaceWith(r.ok ? " · Update started, reload in about a minute" : " · Update failed");
  });
};
</script>
</body>
</html>
